[IniVersion]
Type = 01;  # 00: System INI File; 01: Panel INI File ; 02: DLC INI File
Ver = 0x00000001;

[panel]
m_pPanelName            =   UD_VB1_8LANE_ISP;
###########################
#       Panel output      #
###########################
m_bPanelDither          =   0;
m_ePanelLinkType        =   10;#LINK_LVDS;
m_ePanelLinkExtType     =   62;#apiPNL.h -> APIPNL_LINK_EXT_TYPE
m_bPanelDualPort        =   0;
m_bPanelSwapPort        =   0;#1^PANEL_CONNECTOR_SWAP_PORT;

m_bPanelSwapOdd_ML      =   0;
m_bPanelSwapEven_ML     =   0;
m_bPanelSwapOdd_RB      =   0;
m_bPanelSwapEven_RB     =   0;

m_bPanelLVDS_TI_MODE    =   0;

m_ucPanelDCLKDelay      =   0x00;
m_bPanelInvDCLK         =   0;
m_bPanelInvDE           =   0;
m_bPanelInvHSync        =   0;
m_bPanelInvVSync        =   0;

###########################
#  Output tmming setting  #
###########################
m_ucPanelDCKLCurrent    =   0x01;
m_ucPanelDECurrent      =   0x01;
m_ucPanelODDDataCurrent =   0x01;
m_ucPanelEvenDataCurrent=   0x01;

m_wPanelOnTiming1       =   30;
m_wPanelOnTiming2       =   200;
m_wPanelOffTiming1      =   220;
m_wPanelOffTiming2      =   10;

m_ucPanelHSyncWidth     =   30;
m_ucPanelHSyncBackPorch =   354;

m_ucPanelVSyncWidth     =   4;
m_ucPanelVBackPorch     =   29;

m_wPanelHStart          =   384;#30+354//23+145
m_wPanelVStart          =   33;#4+29//2+63

m_wPanelWidth           =   3840;
m_wPanelHeight          =   2162;

m_wPanelMaxHTotal       =   4500;
m_wPanelHTotal          =   4416;
m_wPanelMinHTotal       =   4300;

m_wPanelMaxVTotal       =   2350;
m_wPanelVTotal          =   2250;
m_wPanelMinVTotal       =   2150;

m_dwPanelMaxDCLK        =   610;
m_dwPanelDCLK           =   600;
m_dwPanelMinDCLK        =   590;

m_wSpreadSpectrumStep   =   0x0019;
m_wSpreadSpectrumSpan   =   0x00C0;

m_ucDimmingCtl          =   0x6D;
m_ucMaxPWMVal           =   0xFF;
m_ucMinPWMVal           =   0x20;

m_bPanelDeinterMode     =   0;

