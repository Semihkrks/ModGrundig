[M_SYSTEM_BASIC]
M_SYSTEM_BASIC_DACOUT_PATH = "/config/panel";
# We Must enable this item when the GOP is output to scaler and scaler occur output timing change.
M_SYSTEM_BASIC_SOC_MUTE = 0;
#whether save 3D gain and offset in database:
#0: don't save.
#1: save gain and offset according to inputsource type. 2Dto3D and real 3D use the same gain
#2: save gain and offset, all sources use the same gain and offset.
#3: save gain and offset according to inputsource type. 2Dto3D and real 3D use different gain
M_SYSTEM_BASIC_SAVE_3D_INFO = 1;

[M_URSA]
